{% extends 'base.html' %}

{% block title %}Пароль изменён — pcshop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <i class="bi bi-shield-check" style="font-size: 4rem; color: var(--brand-success);"></i>
            <h1 class="h4 mt-3">Пароль успешно изменён</h1>
            <p class="text-muted">В дальнейшем используйте новый пароль для входа в систему.</p>
            <div>
                <a class="btn btn-accent" href="{% url 'accounts:dashboard' %}">В личный кабинет</a>
                <a class="btn btn-outline-primary" href="{% url 'home' %}">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
